<div class="container mt-4">
    <h3>Categories</h3>
  
    <div class="mb-3">
      <input type="text" [(ngModel)]="newCategory.name" placeholder="Enter category name" class="form-control" />
      <button class="btn btn-success mt-2" (click)="addCategory()">Add Category</button>
    </div>
  
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let category of categories">
        {{ category.name }}
        <button class="btn btn-danger btn-sm" (click)="deleteCategory(category.categoriesId)">Delete</button>
      </li>
    </ul>
  </div>
