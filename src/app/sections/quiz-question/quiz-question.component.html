<div *ngIf="quizId" class="p-3 border rounded bg-light">
  <h5 class="d-flex justify-content-between align-items-center mb-3">
    <span>
      Questions
      <span class="badge bg-secondary">{{ questions.length }}</span>
    </span>

    <div>
      <button
        class="btn btn-sm btn-outline-dark me-2"
        (click)="toggleQuestionsVisibility()"
        title="Toggle Questions"
      >
        <i class="fas" [ngClass]="showQuestions ? 'fa-eye-slash' : 'fa-eye'"></i>
        {{ showQuestions ? 'Hide Questions' : 'Show Questions' }}
      </button>
      <button
        class="btn btn-sm btn-outline-purple"
        (click)="toggleNewQuestion()"
        title="Add Question"
      >
        <i class="fas fa-plus-circle me-1"></i> Add Question
      </button>
    </div>
  </h5>

  <!-- Questions Section -->
  <ng-container *ngIf="showQuestions">
    <div
      *ngFor="let question of questions; let i = index"
      class="border rounded bg-white mb-2 px-3 py-2 small shadow-sm"
    >
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <!-- Question Label and Text -->
        <div class="d-flex align-items-center flex-grow-1 me-2">
          <strong class="me-2 text-purple">Q{{ i + 1 }}:</strong>
          <ng-container *ngIf="!question.editing; else editMode">
            <span class="text-muted">{{ question.quizQuestionText }}</span>
            <small
              class="ms-2 text-primary"
              style="cursor: pointer"
              (click)="toggleAnswers(question)"
            >
              <i class="fas fa-plus-circle me-1"></i> Add Answers
            </small>
          </ng-container>
        </div>

        <!-- Buttons -->
        <div class="btn-group btn-group-sm mt-2 mt-md-0">
          <button
            class="btn btn-outline-secondary"
            (click)="moveUp(i)"
            [disabled]="i === 0"
            title="Move Up"
          >
            <i class="fas fa-arrow-up"></i>
          </button>
          <button
            class="btn btn-outline-secondary"
            (click)="moveDown(i)"
            [disabled]="i === questions.length - 1"
            title="Move Down"
          >
            <i class="fas fa-arrow-down"></i>
          </button>
          <button
            class="btn btn-outline-primary"
            (click)="toggleEdit(question)"
            title="Edit Question"
          >
            <i class="fas fa-edit"></i>
          </button>
          <button
            class="btn btn-outline-danger"
            (click)="deleteQuestion(question.quizQuestionId!)"
            title="Delete Question"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
          <button
            class="btn btn-outline-success"
            (click)="toggleAnswers(question)"
            title="Show/Hide Answers"
          >
            <i class="fas" [ngClass]="question.showAnswers ? 'fa-minus' : 'fa-plus'"></i> Answers
          </button>
        </div>
      </div>

      <!-- Show Answers -->
      <app-quiz-answers
        *ngIf="question.showAnswers"
        [questionId]="question.quizQuestionId!"
        class="mt-2"
      ></app-quiz-answers>

      <!-- Edit Mode -->
      <ng-template #editMode>
        <div class="mt-2 w-100">
          <textarea
            [(ngModel)]="question.quizQuestionText"
            class="form-control form-control-sm mb-2"
          ></textarea>
          <div>
            <button
              class="btn btn-sm btn-success me-2"
              (click)="saveQuestion(question)"
              title="Save"
            >
              <i class="fas fa-save me-1"></i> Save
            </button>
            <button
              class="btn btn-sm btn-outline-secondary"
              (click)="question.editing = false"
              title="Cancel"
            >
              <i class="fas fa-times-circle me-1"></i> Cancel
            </button>
          </div>
        </div>
      </ng-template>
    </div>
  </ng-container>

  <!-- New Question Form -->
  <div
    *ngIf="showNewQuestion"
    class="mt-3 border p-3 bg-white rounded shadow-sm"
  >
    <h6 class="text-purple">
      <i class="fas fa-question me-1"></i> New Question
    </h6>
    <textarea
      [(ngModel)]="newQuestionText"
      class="form-control form-control-sm mb-2"
      placeholder="Enter new question text..."
    ></textarea>
    <button class="btn btn-sm btn-primary" (click)="addQuestion()">
      <i class="fas fa-plus me-1"></i> Add
    </button>
    <button
      class="btn btn-sm btn-outline-secondary ms-2"
      (click)="showNewQuestion = false"
    >
      <i class="fas fa-times me-1"></i> Cancel
    </button>
  </div>
</div>
