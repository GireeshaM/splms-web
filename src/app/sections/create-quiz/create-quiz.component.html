<!-- Toggle Quizzes Visibility -->
<div class="d-flex justify-content-between align-items-center mb-2">
  <h5 class="text-purple">
    <i class="fas fa-list-alt me-1"></i> Quizzes
    <span class="badge bg-secondary">{{ quizzes.length }}</span>
  </h5>

  <button
    class="btn btn-animated btn-outline-purple btn-sm"
    (click)="toggleAllQuizzes()"
    title="Toggle All Quizzes"
  >
    <i class="fas" [ngClass]="quizzesVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
    {{ quizzesVisible ? " Hide All" : "Show All" }}
  </button>
</div>

<!-- All Quizzes Block -->
<div
  *ngIf="quizzesVisible"
  class="quiz-container p-3 rounded shadow-sm bg-light-purple"
>
  <!-- Existing Quizzes -->
  <div
    *ngFor="let quiz of quizzes; let i = index"
    class="quiz-block mb-3 p-3 bg-white rounded border position-relative"
  >
    <div class="quiz-left-border"></div>

    <div class="d-flex justify-content-between align-items-center">
      <strong>{{ quiz.quizTitle }}</strong>

      <div class="btn-group">
        <button
          class="btn btn-outline-secondary btn-sm"
          (click)="moveQuizUp(i)"
          [disabled]="i === 0"
          title="Move Up"
        >
          <i class="fas fa-arrow-up"></i>
        </button>
        <button
          class="btn btn-outline-secondary btn-sm"
          (click)="moveQuizDown(i)"
          [disabled]="i === quizzes.length - 1"
          title="Move Down"
        >
          <i class="fas fa-arrow-down"></i>
        </button>
        <button
          class="btn btn-outline-purple btn-sm"
          (click)="toggleQuizExpand(quiz)"
          title="Expand/Collapse"
        >
          <i class="fas" [ngClass]="quiz.expanded ? 'fa-minus' : 'fa-plus'"></i>
        </button>
        <button
          class="btn btn-outline-danger btn-sm"
          (click)="deleteQuiz(quiz.createQuizId)"
          title="Delete Quiz"
        >
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>
    </div>

    <!-- Quiz Edit Fields -->
    <div *ngIf="quiz.expanded" class="mt-3">
      <input
        [(ngModel)]="quiz.editingTitle"
        class="form-control mb-2"
        placeholder="Quiz Title"
      />
      <textarea
        [(ngModel)]="quiz.editingDescription"
        class="form-control mb-2"
        placeholder="Quiz Description"
      ></textarea>
      <button class="btn btn-success btn-sm me-2" (click)="updateQuiz(quiz)" title="Save Quiz">
        <i class="fas fa-save me-1"></i> Save
      </button>
      <button
        class="btn btn-outline-secondary btn-sm"
        (click)="quiz.expanded = false"
        title="Close"
      >
        <i class="fas fa-times-circle me-1"></i> Close
      </button>

      <app-quiz-question
        *ngIf="quiz.expanded"
        [quizId]="quiz.createQuizId"
      ></app-quiz-question>
    </div>
  </div>

  <!-- Add New Quiz Button -->
  <div class="text-end mb-2">
    <button
      class="btn btn-animated btn-outline-purple btn-sm"
      (click)="toggleNewQuizForm()"
      title="Add or Cancel New Quiz"
    >
      <i class="fas" [ngClass]="showNewQuizForm ? 'fa-times-circle' : 'fa-plus-circle'"></i>
      {{ showNewQuizForm ? "Cancel" : "Add Quiz" }}
      <span class="badge bg-secondary ms-1">{{ quizzes.length }}</span>
    </button>
  </div>

  <!-- New Quiz Form -->
  <div
    *ngIf="showNewQuizForm"
    class="new-quiz-form mt-3 p-3 rounded bg-white border"
  >
    <div class="d-flex justify-content-between align-items-center">
      <h6 class="mb-2">
        <i class="fas fa-clipboard-question me-1"></i> New Quiz
      </h6>
      <div>
        <button
          class="btn btn-outline-secondary btn-sm me-1"
          (click)="toggleNewQuizExpand()"
          title="Toggle Quiz Form"
        >
          <i class="fas" [ngClass]="newQuizExpanded ? 'fa-minus' : 'fa-plus'"></i>
        </button>
        <button
          class="btn btn-outline-secondary btn-sm"
          (click)="showNewQuizForm = false"
          title="Close New Quiz Form"
        >
          <i class="fas fa-times-circle"></i>
        </button>
      </div>
    </div>

    <div *ngIf="newQuizExpanded">
      <input
        [(ngModel)]="newQuiz.quizTitle"
        class="form-control mb-2"
        placeholder="Quiz Title"
      />
      <textarea
        [(ngModel)]="newQuiz.quizDescription"
        class="form-control mb-2"
        placeholder="Quiz Description"
      ></textarea>
      <button class="btn btn-success btn-sm" (click)="saveQuiz()" title="Save New Quiz">
        <i class="fas fa-save me-1"></i> Save Quiz
      </button>
    </div>
  </div>
</div>
