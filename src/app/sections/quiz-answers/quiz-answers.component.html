<div class="border p-3 bg-white rounded shadow-sm">
  <!-- List Answers -->
  <div *ngFor="let answer of answers; let i = index" class="answer-item p-2 mb-2 rounded border d-flex justify-content-between align-items-start">
    <!-- Edit Mode -->
    <div *ngIf="answer.editing; else viewMode" class="w-100">
      <input
        [(ngModel)]="answer.quizAnswerText"
        class="form-control form-control-sm mb-1"
        placeholder="Answer Text"
      />
      <textarea
        [(ngModel)]="answer.answerDescription"
        class="form-control form-control-sm mb-2"
        placeholder="Description"
      ></textarea>
      <div class="form-check mb-2">
        <input
          type="checkbox"
          class="form-check-input"
          [(ngModel)]="answer.answerCorrectOrNot"
          id="correct-{{i}}"
        />
        <label for="correct-{{i}}" class="form-check-label">Mark as Correct</label>
      </div>
      <button class="btn btn-sm btn-success me-2" (click)="updateAnswer(answer)">
        <i class="fas fa-save"></i> Save
      </button>
      <button class="btn btn-sm btn-secondary" (click)="toggleEdit(answer)">
        <i class="fas fa-times"></i> Cancel
      </button>
    </div>

    <!-- View Mode -->
    <ng-template #viewMode>
      <div class="flex-grow-1">
        <div>
          <strong>{{ answer.quizAnswerText }}</strong>
          <span *ngIf="answer.answerCorrectOrNot" class="badge bg-success ms-2">Correct</span>
        </div>
        <div class="text-muted small">{{ answer.answerDescription }}</div>
      </div>
      <div class="btn-group btn-group-sm ms-2 mt-1">
        <button class="btn btn-outline-secondary" (click)="moveUp(i)" [disabled]="i === 0" title="Move Up">
          <i class="fas fa-arrow-up"></i>
        </button>
        <button class="btn btn-outline-secondary" (click)="moveDown(i)" [disabled]="i === answers.length - 1" title="Move Down">
          <i class="fas fa-arrow-down"></i>
        </button>
        <button class="btn btn-outline-primary" (click)="toggleEdit(answer)" title="Edit Answer">
          <i class="fas fa-edit"></i>
        </button>
        <button class="btn btn-outline-danger" (click)="deleteAnswer(answer.quizAnswerId)" title="Delete Answer">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>
    </ng-template>
  </div>

  <!-- Add Answer Button -->
  <button class="btn btn-sm btn-outline-primary" (click)="toggleNewAnswer()">
    <i class="fas fa-plus-circle me-1"></i>
    {{ showNewAnswerForm ? 'Cancel' : 'Add Answer' }}
  </button>

  <!-- Add New Answer Form -->
  <div *ngIf="showNewAnswerForm" class="mt-3 border rounded p-3 bg-light">
    <input
      type="text"
      [(ngModel)]="newAnswer.quizAnswerText"
      class="form-control form-control-sm mb-2"
      placeholder="Enter answer text"
    />
    <textarea
      [(ngModel)]="newAnswer.answerDescription"
      class="form-control form-control-sm mb-2"
      placeholder="Optional description..."
    ></textarea>
    <div class="form-check mb-2">
      <input
        type="checkbox"
        id="correctNew"
        class="form-check-input"
        [(ngModel)]="newAnswer.answerCorrectOrNot"
      />
      <label for="correctNew" class="form-check-label">Mark as Correct</label>
    </div>
    <button class="btn btn-sm btn-success" (click)="saveAnswer()">
      <i class="fas fa-save me-1"></i> Save
    </button>
  </div>
</div>
