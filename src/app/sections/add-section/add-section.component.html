<app-navbar></app-navbar>

<div class="container-fluid px-4 section-manager mt-4 p-4 rounded shadow bg-light-purple">
  <h2 class="text-center mb-4 text-purple fw-bold">
    📘 Manage Sections
  </h2>
  <app-process-flow></app-process-flow>

  <!-- + Add Section Button -->
  <div class="mb-3 text-end">
    <button class="btn btn-animated btn-outline-purple" (click)="addTempSection()">
      <i class="fas fa-plus-circle me-1"></i> Add Section
    </button>
  </div>

  <!-- Drag and Drop Wrapper -->
  <div
    cdkDropList
    [cdkDropListData]="sections"
    (cdkDropListDropped)="dropSection($event)"
    class="section-drop-list"
  >
    <!-- Section Loop -->
    <div
      *ngFor="let section of sections; let i = index"
      cdkDrag
      class="section-block mb-4 p-4 rounded shadow-sm bg-white position-relative"
    >
      <!-- Animated left border -->
      <div class="section-left-border"></div>

      <!-- Header: Section Order + Section Name + Controls -->
      <div class="d-flex justify-content-between align-items-center section-header">
        <div class="d-flex align-items-center flex-grow-1 pe-3">
          <!-- Section Order Circle Input -->
          <div class="order-circle-box">
            <input
              type="number"
              class="order-input"
              [(ngModel)]="section.sectionOrder"
              (change)="saveSectionOrder(section)"
              min="1"
              [max]="sections.length"
              aria-label="Section order"
            />
          </div>

          <!-- Section Name Input -->
          <input
            [(ngModel)]="section.sectionName"
            class="form-control fw-semibold"
            placeholder="Section Name"
            aria-label="Section name"
          />
        </div>

        <!-- Controls -->
        <div class="btn-group">
          <button class="btn btn-outline-purple btn-sm" (click)="toggleSection(i)">
            <i class="fas" [ngClass]="section.expanded ? 'fa-minus' : 'fa-plus'"></i>
          </button>
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="moveSectionUp(i)"
            [disabled]="i === 0"
          >
            <i class="fas fa-arrow-up"></i>
          </button>
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="moveSectionDown(i)"
            [disabled]="i === sections.length - 1"
          >
            <i class="fas fa-arrow-down"></i>
          </button>
          <button
            class="btn btn-outline-danger btn-sm"
            *ngIf="section.sectionId"
            (click)="deleteSection(section.sectionId!)"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </div>

      <!-- Quiz & Video Summary (collapsed view) -->
      <div *ngIf="!section.expanded && section.quizCount !== undefined" class="text-muted small mt-1 ps-5">
        <i class="fas fa-question-circle me-1"></i> Quizzes: {{ section.quizCount }}
        <span class="ms-3">
          <i class="fas fa-video me-1"></i> Videos: {{ section.videos?.length || 0 }}
        </span>
      </div>

      <!-- Section Body (expanded) -->
      <div *ngIf="section.expanded" class="section-body mt-3" [@fadeInOut]>
        <textarea
          [(ngModel)]="section.sectionObjective"
          class="form-control mb-3"
          placeholder="Section Objective"
          aria-label="Section objective"
        ></textarea>

        <div class="d-flex justify-content-between align-items-center">
          <button class="btn btn-animated btn-success btn-sm" (click)="saveSection(section)">
            <i class="fas fa-save me-1"></i> Save
          </button>

          <div>
            <button
              class="btn btn-animated btn-outline-purple btn-sm me-2"
              (click)="toggleQuizForm(section)"
              [disabled]="!section.sectionId"
            >
              <i class="fas fa-plus me-1"></i> Add Quiz
              <span class="badge bg-secondary ms-1">{{ section.quizzes?.length || 0 }}</span>
            </button>
            <button
              class="btn btn-animated btn-outline-info btn-sm"
              (click)="toggleVideoForm(section)"
              [disabled]="!section.sectionId"
            >
              <i class="fas fa-video me-1"></i> Add Videos
              <span class="badge bg-secondary ms-1">{{ section.videos?.length || 0 }}</span>
            </button>
          </div>
        </div>

        <!-- Quiz Form -->
        <div class="mt-3" *ngIf="section.showQuizForm && section.sectionId != null">
          <app-create-quiz [sectionId]="section.sectionId"></app-create-quiz>
        </div>
        <!-- Videos Form -->
        <div class="mt-3" *ngIf="section.showVideoForm && section.sectionId != null">
          <app-add-video [sectionId]="section.sectionId" [courseId]="courseId"></app-add-video>
        </div>
      </div>
    </div>
  </div>
</div>
