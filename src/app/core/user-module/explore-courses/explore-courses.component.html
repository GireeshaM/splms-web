<app-navbar></app-navbar>
<div class="banner-container position-relative text-white">
  <!-- Responsive Banner Image -->
  <img src="images/explore-banner.svg"  alt="LinkedIn Banner"  class="img-fluid w-100" />

  <!-- Overlay Text -->
  <div class="overlay position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center text-center">
    <h1 class="display-5 fw-bold">Welcome to SLMS</h1>
    <p class="lead">Connect, grow, and network professionally</p>
  </div>
</div>

<!-- Full-width container -->
<div class="container-fluid">
  <div class="row min-vh-100">
    <!-- Sidebar -->
    <nav id="sidebar"  class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse"  [ngClass]="{ show: sidebarVisible }">
      <div class="position-sticky pt-3">
        <h4 class="px-3">Filter Courses</h4>
        <div *ngFor="let group of filterGroups" class="mb-4">
          <label class="form-label fw-bold px-3">{{ group.label }}</label>
          <div class="px-3">
            <div *ngFor="  let item of group.items.slice(  0,
                group.key === 'level' || group.key === 'duration'  ? group.items.length  : 5  ) " class="form-check">
              <input  class="form-check-input"  type="checkbox" [value]="item.id || item"  [checked]="isChecked(group.key, item.id || item)"
                (change)="onFilterChange(group.key, $event)"  [id]="group.key + '-' + (item.id || item)"/>
              <label class="form-check-label"  [for]="group.key + '-' + (item.id || item)"  >{{ item.name || item }}</label >
            </div>
            <!-- See More button only for category, subCategory, and skill -->
            <button  *ngIf="group.key !== 'level' && group.key !== 'duration'"  class="btn btn-link btn-sm mt-2 px-0"  
            (click)="showModal(group.key)"  type="button" >
              See More <i class="bi bi-chevron-down"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Hamburger button -->
    <nav class="navbar navbar-light bg-light d-md-none w-100">
      <div class="container-fluid">
        <button  class="btn btn-outline-primary"   type="button"  (click)="toggleSidebar()"  aria-label="Toggle sidebar" >
          <i class="bi bi-list fs-3"></i>
        </button>
        <span class="navbar-brand mb-0 h1">Explore Courses</span>
      </div>
    </nav>

    <!-- Courses main content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
      <!-- Search Bar -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input  type="text" class="form-control"  placeholder="Search by title, category, subcategory, level, skill..." [(ngModel)]="searchQuery" (input)="applyFilters()" />
          </div>
        </div>
      </div>

                  <!-- Courses Grid -->
            <div class="row g-3">
              <div  *ngFor="let course of paginatedCourses" class="col-sm-6 col-md-4 col-lg-3">
                  <div class="card h-100 shadow-sm position-relative" >
                          <img [src]="getThumbnail(course['thumbnail'])" style="cursor: pointer" (click)="goToCoursePreview(course)" class="card-img-top" alt="Course Thumbnail"  style="height: 160px; object-fit: cover"  />
                            <!-- ❤ Wishlist Icon (Top-Right or Bottom-Right Corner) -->
                            <i class="bi wishlist-icon position-absolute top-0 end-0 m-2" style="cursor: pointer; font-size: 1.4rem;"  [ngClass]="{  'bi-heart-fill text-danger': course.isWishlisted, 
                              'bi-heart': !course.isWishlisted }"
                              (click)="toggleWishlist(course)"></i>
                            <div class="card-body d-flex flex-column">
                              <h5 class="card-title">{{ course["courseTitle"] }}</h5>
                                                          <p> Duration:{{ formattedDurations[course.createCourseId ?? course.id] || ' --' }}</p>

                              <h6>{{course["level"]}}</h6>
                              <button  class="btn btn-primary mt-auto"  [disabled]="course.isEnrolled"  (click)="enroll(course)" >
                                <i class="bi"  [ngClass]=" course.isEnrolled ? 'bi-check-circle-fill' : 'bi-cart-plus'"></i>
                                {{ course.isEnrolled ? "Already Enrolled" : "Enroll Now" }}
                              </button>
                            </div>
                  </div>
              </div>
            </div>


      <!-- Pagination -->
      <nav aria-label="Page navigation" class="mt-4 d-flex justify-content-center align-items-center gap-3" >
        <button  class="btn btn-outline-secondary"(click)="prevPage()"  [disabled]="currentPage === 1"   aria-label="Previous page">
          <i class="bi bi-chevron-left"></i> Prev
        </button>
        <span>Page {{ currentPage }} / {{ totalPages }}</span>
        <button   class="btn btn-outline-secondary"  (click)="nextPage()"  [disabled]="currentPage === totalPages"  aria-label="Next page">
          Next 
          <i class="bi bi-chevron-right"></i>
        </button>
      </nav>
    </main>
    <!-- Modal Overlay -->
    <div  class="modal fade show"
      tabindex="-1"  [ngClass]="{ 'd-block': modalVisible }" style="background-color: rgba(0, 0, 0, 0.6)" aria-modal="true" role="dialog">
      <div class="modal-dialog modal-dialog-scrollable modal-lg modal-dialog-centered custom-modal-width">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Select {{ modalType | titlecase }}</h5>
            <button  type="button"  class="btn-close" (click)="closeModal()"aria-label="Close" ></button>
          </div>
          <div class="modal-body">
            <div class="row row-cols-2 row-cols-md-3 g-3">
              <div *ngFor="let item of modalItems" class="col">
                <div class="form-check">
                  <input  class="form-check-input"  type="checkbox"  [value]="item.value"  [checked]="modalSelections.has(item.value)" 
                     (change)="toggleModalSelection(item.value, $event)"  [id]="'modal-' + item.value" />
                  <label  class="form-check-label"  [for]="'modal-' + item.value"  >{{ item.label }}</label >
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary"  (click)="applyModalSelection()">
              Apply
            </button>
             <button type="button" class="btn btn-secondary"(click)="closeModal()">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
