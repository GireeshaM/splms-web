<app-navbar></app-navbar>

<div class="container py-4">
  <h2 class="mb-4 fw-bold text-primary">My Created Courses</h2>

  <!-- Filter & Sort Controls -->
  <!-- Filter & Sort Controls -->
  <div class="row mb-3 g-2 align-items-center">
    <!-- Level Filter -->
    <div class="col-md-3">
      <div class="input-group input-group-sm shadow-sm">
        <span class="input-group-text bg-white" title="Filter by Level">
          <i class="bi bi-sliders2-vertical text-muted"></i>
        </span>
        <select
          class="form-select"
          [(ngModel)]="selectedLevel"
          (change)="applyFiltersAndSorting()"
          title="Filter by Level"
        >
          <option value="">All Levels</option>
          <option *ngFor="let level of allLevels" [value]="level">
            {{ level }}
          </option>
        </select>
      </div>
    </div>

    <!-- Search Courses -->
    <div class="col-md-5">
      <div class="input-group input-group-sm shadow-sm">
        <span class="input-group-text bg-white" title="Search Courses">
          <i class="bi bi-search text-muted"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Search courses..."
          [(ngModel)]="searchText"
          (input)="applyFiltersAndSorting()"
          title="Search by Course Title"
        />
      </div>
    </div>

    <!-- Sort Buttons -->
    <div class="col-md-2 d-flex justify-content-end gap-2">
      <div class="btn-group btn-group-sm shadow-sm" role="group">
        <button
          class="btn btn-outline-primary"
          (click)="setSortOption('created')"
          [class.active]="sortOption === 'created'"
          title="Sort by Created Date"
        >
          <i class="bi bi-calendar-plus"></i>
        </button>
        <button
          class="btn btn-outline-primary"
          (click)="setSortOption('updated')"
          [class.active]="sortOption === 'updated'"
          title="Sort by Updated Date"
        >
          <i class="bi bi-calendar-check"></i>
        </button>
        <button
          class="btn btn-outline-secondary"
          (click)="toggleSortOrder()"
          title="Toggle Sort Order"
        >
          <i
            class="bi"
            [ngClass]="sortOrder === 'desc' ? 'bi-sort-down' : 'bi-sort-up'"
          ></i>
        </button>
      </div>
    </div>

    <!-- Status Filter + Clear -->
    <div class="col-md-2 d-flex justify-content-end gap-2">
      <div
        class="form-check form-switch d-flex align-items-center"
        title="Filter by Admin Review"
      >
        <input
          class="form-check-input me-2"
          type="checkbox"
          id="adminReviewed"
          [(ngModel)]="filterAdminReviewed"
          (change)="applyFiltersAndSorting()"
        />
        <label class="form-check-label small" for="adminReviewed">
          <i class="bi bi-shield-check me-1 text-success"></i>
          Admin
        </label>
      </div>

      <!-- Clear Button -->
      <button
        class="btn btn-outline-danger btn-sm shadow-sm d-flex align-items-center"
        (click)="clearFilters()"
        title="Clear Filters"
      >
        <i class="bi bi-x-circle me-1"></i>
      </button>
    </div>
  </div>

  <!-- Loading & No Courses Messages -->
  <div *ngIf="loading" class="text-center text-muted fs-5">Loading...</div>
  <div
    *ngIf="!loading && filteredCourses.length === 0"
    class="text-center text-secondary fs-5"
  >
    No courses found.
  </div>

  <!-- Course Cards -->
  <div class="d-flex flex-column gap-4">
    <div
      class="card position-relative border-0 rounded-4 shadow-sm overflow-hidden"
      *ngFor="let course of filteredCourses"
      [@fadeInUp]
    >
      <!-- Delete Icon (top-right) -->
      <button
        class="btn btn-sm btn-light position-absolute top-0 end-0 m-2 shadow-sm rounded-circle"
        (click)="deleteCourse(course.createCourseId)"
        title="Delete Course"
      >
        <i class="bi bi-trash-fill text-danger fs-5"></i>
      </button>

      <!-- Card Body -->
      <div class="row g-0">
        <!-- Thumbnail -->
        <!-- Thumbnail -->
        <div class="col-md-4">
          <a [routerLink]="['/course-preview', course.createCourseId]">
            <img
              *ngIf="course.thumbnail"
              [src]="'data:image/jpeg;base64,' + course.thumbnail"
              alt="Course Thumbnail"
              class="img-fluid h-100 object-fit-cover"
              style="cursor: pointer"
            />
          </a>
        </div>

        <!-- Details -->
        <div class="col-md-8">
          <div
            class="card-body p-4 bg-light h-100 d-flex flex-column justify-content-between"
          >
            <div>
              <h5 class="card-title fw-bold text-dark mb-1">
                <a
                  [routerLink]="['/course-preview', course.createCourseId]"
                  class="text-decoration-none text-dark"
                  style="cursor: pointer"
                >
                  {{ course.courseTitle }}
                </a>
              </h5>
              <span class="badge bg-primary-subtle text-dark">{{
                course.level
              }}</span>
              <p class="card-text mt-2 text-muted small">
                last Update &nbsp;
                <i class="bi bi-calendar-event me-1"></i>
                {{ course.courseUpdatedDate | date : "mediumDate" }}
              </p>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-3">
              <a
                [routerLink]="['/editcourse', course.createCourseId]"
                class="btn btn-sm btn-outline-primary"
              >
                <i class="fas fa-edit me-1"></i> Edit
              </a>
              <a
                [routerLink]="['/add-sections', course.createCourseId]"
                class="btn btn-sm btn-outline-secondary"
              >
                <i class="fas fa-layer-group me-1"></i> Sections
              </a>
              
              <a
                [routerLink]="[
                  '/course-display-preview',
                  course.createCourseId
                ]"
                class="btn btn-sm btn-outline-dark"
              >
                <i class="fas fa-tv me-1"></i> Display View
              </a>
              <button
                class="btn btn-sm btn-success"
                (click)="sendToAdmin(course.createCourseId)"
                [disabled]="course.adminReview"
              >
                <i class="bi bi-send-fill me-1"></i>
                {{ course.adminReview ? "Sent to Admin" : "Send to Admin" }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
