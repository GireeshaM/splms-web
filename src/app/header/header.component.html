<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light py-1" *ngIf="!isHomePage">
  <div class="container-fluid">
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center">
      <img src="assets/app logo.png" alt="Logo" class="logo-img me-2" routerLink="/" />
      <i class="fas fa-home me-2" style="cursor: pointer;" (click)="goToDashboard()"></i>
    </a>
    <!-- Toggler for small screens -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <!-- Collapsible content -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <!-- Left part: Module dropdowns -->
      <ul class="navbar-nav mb-2 mb-lg-0 d-flex align-items-center">
        <!-- Navigation dropdowns -->
        <li class="nav-item dropdown" *ngFor="let group of filteredModules">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i [class]="group.module.icon"></i> {{ group.module.moduleName }}
          </a>
          <ul class="dropdown-menu custom-dropdown-menu">
            <li *ngFor="let item of group.items">
              <a class="dropdown-item" [routerLink]="item.url">
                <i [class]="item.icon"></i> {{ item.menuItemName }}
              </a>
            </li>
          </ul>
        </li>
      </ul>
      <!-- Right part: Search bar and Profile -->
      <div class="ms-auto d-flex align-items-center">
        <!-- Search Bar -->
        <form class="d-flex me-3" (submit)="onSearch(); $event.preventDefault();">
          <input
            class="form-control me-1"
            type="search"
            placeholder="Search for courses, modules..."
            (input)="onSearch()" />
          <button class="btn btn-outline-success" type="submit">
            <i class="fas fa-search"></i>
          </button>
        </form>
        <!-- Profile dropdown -->
        <ul class="navbar-nav">
          <li class="nav-item dropdown" *ngIf="isLoggedIn">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fas fa-user-circle fa-3x"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" (click)="viewProfile()">View Profile</a>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a class="dropdown-item text-danger" (click)="logout()">Logout</a>
              </li>
            </ul>
          </li>
          </ul>
      </div>
    </div>
  </div>
</nav>
