<nav class="navbar" *ngIf="!isHomePage">
  <div class="navbar-left" (click)="goToDashboard()" style="cursor: pointer;">
    <img src="assets/app logo.png" alt="Logo" class="logo-img" />
    <span class="logo-text">SprintparkLMS</span>
  </div>

  <!-- Search bar -->
  <div class="navbar-search">
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Search for courses, modules..."
        (input)="onSearch()"
      />
      <button class="search-button" (click)="onSearch()">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </div>

  <!-- Navigation links -->
  <ul class="nav-links">
    <li *ngFor="let group of filteredModules" class="dropdown">
      <a href="javascript:void(0)" class="dropdown-toggle">
        <i [class]="group.module.icon"></i> {{ group.module.moduleName }}
      </a>
      <ul class="dropdown-menu">
        <li *ngFor="let item of group.items">
          <a [routerLink]="item.url">
            <i [class]="item.icon"></i> {{ item.menuItemName }}
          </a>
        </li>
      </ul>
    </li>
    <li *ngIf="isLoggedIn">
      <button class="logout-button" (click)="logout()">Logout</button>
    </li>
  </ul>
</nav>
