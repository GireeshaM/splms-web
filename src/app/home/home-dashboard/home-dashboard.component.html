<div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel"
  (slide.bs.carousel)="onSlide($event)">
  <app-home-navbar></app-home-navbar>


  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
      aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
      aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
      aria-label="Slide 3"></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active">
      <video class="d-block w-100" autoplay muted loop>
        <source src="images/video2.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="dynamic-text fadeInUp">
        <h2 class="title">{{ dynamicText.title }}</h2>
        <p class="description">{{ dynamicText.description }}</p>
        <button class="cta-button" (click)="openLoginModal()">Start Now</button>
      </div>
    </div>
    <div class="carousel-item">
      <video class="d-block w-100" autoplay muted loop>
        <source src="images/video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="dynamic-text fadeInUp">
        <h2 class="title">{{ dynamicText.title }}</h2>
        <p class="description">{{ dynamicText.description }}</p>
        <button class="cta-button" (click)="openLoginModal()">Start Now</button>
      </div>
    </div>
    <div class="carousel-item">
      <video class="d-block w-100" autoplay muted loop>
        <source src="images/video3.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="dynamic-text fadeInUp">
        <h2 class="title">{{ dynamicText.title }}</h2>
        <p class="description">{{ dynamicText.description }}</p>
        <button class="cta-button" (click)="openLoginModal()">Start Now</button>
      </div>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
<app-mainpage></app-mainpage>
<app-top-trends></app-top-trends>
<app-homereviews></app-homereviews>
